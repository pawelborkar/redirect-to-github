<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://git.new/pgit" />
  <title>Redirecting to Pawel's GitHub</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    p {
      font-size: 2rem;
      padding: 8px 16px;
      border-radius: 8px;
      background-color: rgba(0, 0, 0, 0.25);
      color: white;
    }

    a {
      color: #aadfff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p>If you are not redirected, <a href="https://git.new/pgit">click here</a>.</p>

  <script>
    const url = "https://res.cloudinary.com/pawelb/image/upload/v1764837347/japan-background-digital-art-2_eievi9.avif";
    document.body.style.backgroundImage = `url('${url}')`;
  </script>
</body>
</html>
